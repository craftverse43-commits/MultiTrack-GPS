
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiTrack GPS Admin</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  padding: 16px;
  margin: 0;
}

.container { max-width: 850px; margin: auto; }

.panel {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin: 16px 0;
  box-shadow: 0 2px 8px #00000010;
}

.hidden { display: none !important; }

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
}

button {
  padding: 11px 15px;
  background: #1d4ed8;
  color: white;
  border: 0;
  border-radius: 7px;
  margin: 5px 3px 5px 0;
  cursor: pointer;
}

.approve { background: #15803d; }
.reject { background: #dc2626; }
.logout { background: #64748b; }
.refresh { background: #475569; }

.employee {
  border: 1px solid #e2e8f0;
  border-radius: 9px;
  padding: 14px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.employee p { margin: 7px 0; }

.section-title {
  margin-top: 25px;
  border-bottom: 1px solid #e2e8f0;
  padding-bottom: 8px;
}

#map {
  width: 100%;
  height: 420px;
  border-radius: 10px;
  background: #e2e8f0;
}

#message {
  padding: 10px 0;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<div class="container">

<h1>MultiTrack GPS</h1>
<p>Admin Employee Management & Live GPS Map</p>

<div class="panel" id="loginPanel">
  <h2>Admin Login</h2>
  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Admin Password">
  <button id="loginBtn">Login</button>
</div>

<div class="panel hidden" id="adminPanel">

  <h2>Live GPS Map</h2>
  <p id="gpsStatus">Waiting for GPS locations...</p>
  <div id="map"></div>

  <h2>Employee Management</h2>
  <button class="refresh" id="refreshBtn">Refresh Employees</button>

  <h3 class="section-title">Pending Employees</h3>
  <div id="pendingList">Loading...</div>

  <h3 class="section-title">Approved Employees</h3>
  <div id="approvedList">Loading...</div>

  <h3 class="section-title">Rejected Employees</h3>
  <div id="rejectedList">Loading...</div>

  <button class="logout" id="logoutBtn">Logout</button>
</div>

<p id="message"></p>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDQAe8VJIfwoxykr45mPoNXGFkMnG3Q8M0",
  authDomain: "multitrack-gps.firebaseapp.com",
  databaseURL: "https://multitrack-gps-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "multitrack-gps",
  storageBucket: "multitrack-gps.firebasestorage.app",
  messagingSenderId: "646292574395",
  appId: "1:646292574395:web:4d97b3aced2aad3fd1199e",
  measurementId: "G-FVWTQ5HRRG"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_UID = "Mc3aac9Pijcu3M0vDDAxGQ59FM32";

const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");
const message = document.getElementById("message");

const pendingList = document.getElementById("pendingList");
const approvedList = document.getElementById("approvedList");
const rejectedList = document.getElementById("rejectedList");
const gpsStatus = document.getElementById("gpsStatus");

let map = null;
let markers = {};
let employeeNames = {};
let locationListenerActive = false;

function showMessage(text, error = false) {
  message.textContent = text;
  message.style.color = error ? "#dc2626" : "#15803d";
}

function checkAdmin() {
  return auth.currentUser &&
         auth.currentUser.uid === ADMIN_UID;
}

// MAP INITIALIZATION

function initializeMap() {
  if (map) {
    setTimeout(() => map.invalidateSize(), 200);
    return;
  }

  map = L.map("map").setView([7.8731, 80.7718], 7);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19
  }).addTo(map);

  setTimeout(() => map.invalidateSize(), 300);
}

// LOAD EMPLOYEES

async function loadEmployees() {
  if (!checkAdmin()) return;

  try {
    const snapshot = await db.ref("employeeProfiles").once("value");

    pendingList.textContent = "";
    approvedList.textContent = "";
    rejectedList.textContent = "";

    employeeNames = {};

    let pendingCount = 0;
    let approvedCount = 0;
    let rejectedCount = 0;

    if (!snapshot.exists()) {
      pendingList.textContent = "No employee registrations found.";
      approvedList.textContent = "No approved employees.";
      rejectedList.textContent = "No rejected employees.";
      return;
    }

    snapshot.forEach(child => {
      const uid = child.key;
      const employee = child.val();
      const status = employee.status || "pending";
      const name = employee.name || "Unknown employee";

      employeeNames[uid] = name;

      const card = document.createElement("div");
      card.className = "employee";

      const nameText = document.createElement("p");
      nameText.textContent = "Name: " + name;

      const emailText = document.createElement("p");
      emailText.textContent = "Email: " + (employee.email || "");

      const statusText = document.createElement("p");
      statusText.textContent = "Status: " + status;

      card.append(nameText, emailText, statusText);

      if (status === "pending") {
        pendingCount++;

        const approveBtn = document.createElement("button");
        approveBtn.className = "approve";
        approveBtn.textContent = "Approve";
        approveBtn.onclick = () => approveEmployee(uid);

        const rejectBtn = document.createElement("button");
        rejectBtn.className = "reject";
        rejectBtn.textContent = "Reject";
        rejectBtn.onclick = () => rejectEmployee(uid);

        card.append(approveBtn, rejectBtn);
        pendingList.appendChild(card);

      } else if (status === "approved") {
        approvedCount++;
        approvedList.appendChild(card);

      } else if (status === "rejected") {
        rejectedCount++;
        rejectedList.appendChild(card);
      }
    });

    if (!pendingCount) pendingList.textContent = "No pending employees.";
    if (!approvedCount) approvedList.textContent = "No approved employees.";
    if (!rejectedCount) rejectedList.textContent = "No rejected employees.";

    showMessage("Employee list updated.");

  } catch (error) {
    showMessage("Unable to load employees: " + error.message, true);
  }
}

// APPROVE EMPLOYEE

async function approveEmployee(uid) {
  if (!checkAdmin()) return;
  if (!confirm("Approve this employee?")) return;

  try {
    const updates = {};
    updates["employeeProfiles/" + uid + "/status"] = "approved";
    updates["authorizedEmployees/" + uid] = true;

    await db.ref().update(updates);

    showMessage("Employee approved.");
    loadEmployees();

  } catch (error) {
    showMessage("Approval failed: " + error.message, true);
  }
}

// REJECT EMPLOYEE

async function rejectEmployee(uid) {
  if (!checkAdmin()) return;
  if (!confirm("Reject this employee?")) return;

  try {
    const updates = {};
    updates["employeeProfiles/" + uid + "/status"] = "rejected";
    updates["authorizedEmployees/" + uid] = null;

    await db.ref().update(updates);

    showMessage("Employee rejected.");
    loadEmployees();

  } catch (error) {
    showMessage("Rejection failed: " + error.message, true);
  }
}

// LIVE LOCATION LISTENER

function startLocationListener() {
  if (!checkAdmin() || locationListenerActive) return;

  locationListenerActive = true;

  db.ref("locations").on("value", snapshot => {
    if (!checkAdmin() || !map) return;

    let count = 0;
    const activeUIDs = new Set();

    snapshot.forEach(child => {
      const uid = child.key;
      const location = child.val();

      if (!location) return;

      const lat = Number(location.latitude);
      const lng = Number(location.longitude);

      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
      if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return;

      activeUIDs.add(uid);
      count++;

      const name = employeeNames[uid] || "Employee";

      const popup = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = name;

      const time = document.createElement("p");
      time.textContent = "Last update: " +
        (location.timestamp
          ? new Date(Number(location.timestamp)).toLocaleString()
          : "Unknown");

      const accuracy = document.createElement("p");
      accuracy.textContent = "Accuracy: " +
        (location.accuracy ?? "Unknown") + " m";

      popup.append(title, time, accuracy);

      if (markers[uid]) {
        markers[uid].setLatLng([lat, lng]);
        markers[uid].setPopupContent(popup);
      } else {
        markers[uid] = L.marker([lat, lng])
          .addTo(map)
          .bindPopup(popup);
      }
    });

    Object.keys(markers).forEach(uid => {
      if (!activeUIDs.has(uid)) {
        map.removeLayer(markers[uid]);
        delete markers[uid];
      }
    });

    gpsStatus.textContent = count
      ? count + " employee location(s) received."
      : "No GPS locations received yet.";
  }, error => {
    gpsStatus.textContent = "GPS data error: " + error.message;
  });
}

// LOGIN STATE

auth.onAuthStateChanged(user => {
  adminPanel.classList.add("hidden");
  loginPanel.classList.add("hidden");

  if (user && user.uid === ADMIN_UID) {
    loginPanel.classList.add("hidden");
    adminPanel.classList.remove("hidden");

    initializeMap();
    loadEmployees();
    startLocationListener();

    showMessage("Admin verified successfully.");

  } else {
    adminPanel.classList.add("hidden");
    loginPanel.classList.remove("hidden");

    if (user) {
      showMessage("Admin access denied. Please sign out.", true);
    } else {
      showMessage("Please login as Admin.");
    }
  }
});

// LOGIN BUTTON

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter Admin Email and Password.", true);
    return;
  }

  try {
    if (auth.currentUser) await auth.signOut();

    await auth.signInWithEmailAndPassword(email, password);
    showMessage("Login successful.");

  } catch (error) {
    showMessage(error.message, true);
  }
};

// REFRESH

document.getElementById("refreshBtn").onclick = () => {
  loadEmployees();
};

// LOGOUT

document.getElementById("logoutBtn").onclick = async () => {
  await auth.signOut();
  showMessage("Logged out.");
};
</script>
</body>
</html>
