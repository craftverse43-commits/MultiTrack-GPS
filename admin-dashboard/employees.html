
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiTrack GPS - Employee Management</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  padding: 16px;
  margin: 0;
}

.container {
  max-width: 750px;
  margin: auto;
}

.panel {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin: 16px 0;
  box-shadow: 0 2px 8px #00000010;
}

.hidden { display: none !important; }

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
}

button {
  padding: 11px 15px;
  background: #1d4ed8;
  color: white;
  border: 0;
  border-radius: 7px;
  margin: 5px 3px 5px 0;
  cursor: pointer;
}

button:disabled { opacity: .6; }

.approve { background: #15803d; }
.reject { background: #dc2626; }
.logout { background: #64748b; }
.refresh { background: #475569; }

.employee {
  border: 1px solid #e2e8f0;
  border-radius: 9px;
  padding: 14px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.employee p {
  margin: 7px 0;
}

.status {
  font-weight: bold;
  text-transform: capitalize;
}

#message {
  padding: 10px 0;
  overflow-wrap: anywhere;
}

.section-title {
  margin-top: 25px;
  border-bottom: 1px solid #e2e8f0;
  padding-bottom: 8px;
}
</style>
</head>

<body>

<div class="container">

<h1>MultiTrack GPS</h1>
<p>Admin Employee Management</p>

<!-- LOGIN -->

<div class="panel" id="loginPanel">

  <h2>Admin Login</h2>

  <input
    id="email"
    type="email"
    placeholder="Admin Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Admin Password"
  >

  <button id="loginBtn">Login</button>

</div>

<!-- ADMIN DASHBOARD -->

<div class="panel hidden" id="adminPanel">

  <h2>Admin Dashboard</h2>

  <button class="refresh" id="refreshBtn">
    Refresh Employees
  </button>

  <h3 class="section-title">Pending Employees</h3>
  <div id="pendingList">Loading...</div>

  <h3 class="section-title">Approved Employees</h3>
  <div id="approvedList">Loading...</div>

  <h3 class="section-title">Rejected Employees</h3>
  <div id="rejectedList">Loading...</div>

  <button class="logout" id="logoutBtn">
    Logout
  </button>

</div>

<p id="message"></p>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>

// FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyDQAe8VJIfwoxykr45mPoNXGFkMnG3Q8M0",
  authDomain: "multitrack-gps.firebaseapp.com",
  databaseURL: "https://multitrack-gps-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "multitrack-gps",
  storageBucket: "multitrack-gps.firebasestorage.app",
  messagingSenderId: "646292574395",
  appId: "1:646292574395:web:4d97b3aced2aad3fd1199e",
  measurementId: "G-FVWTQ5HRRG"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

// ADMIN UID

const ADMIN_UID = "Mc3aac9Pijcu3M0vDDAxGQ59FM32";

// ELEMENTS

const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");
const message = document.getElementById("message");

const pendingList = document.getElementById("pendingList");
const approvedList = document.getElementById("approvedList");
const rejectedList = document.getElementById("rejectedList");

let loadingEmployees = false;

// MESSAGE

function showMessage(text, error = false) {
  message.textContent = text;
  message.style.color = error ? "#dc2626" : "#15803d";
}

// AUTHENTICATION

adminPanel.classList.add("hidden");
loginPanel.classList.add("hidden");

auth.onAuthStateChanged(user => {

  if (user && user.uid === ADMIN_UID) {

    loginPanel.classList.add("hidden");
    adminPanel.classList.remove("hidden");

    showMessage("Admin verified successfully.");

    loadEmployees();

  } else {

    adminPanel.classList.add("hidden");
    loginPanel.classList.remove("hidden");

    if (user) {
      showMessage("Admin access denied.", true);
    } else {
      showMessage("Please login as Admin.");
    }

  }

});

// LOGIN

document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");

  if (!email || !password) {
    showMessage("Enter Admin Email and Password.", true);
    return;
  }

  btn.disabled = true;

  try {

    await auth.signInWithEmailAndPassword(email, password);

    showMessage("Login successful.");

  } catch (error) {

    showMessage(error.message, true);

  } finally {

    btn.disabled = false;

  }

};

// CHECK ADMIN BEFORE DATABASE ACTIONS

function checkAdmin() {
  return auth.currentUser &&
    auth.currentUser.uid === ADMIN_UID;
}

// LOAD EMPLOYEES

async function loadEmployees() {

  if (!checkAdmin() || loadingEmployees) return;

  loadingEmployees = true;

  pendingList.textContent = "Loading...";
  approvedList.textContent = "Loading...";
  rejectedList.textContent = "Loading...";

  try {

    const snapshot = await db.ref("employeeProfiles").once("value");

    pendingList.textContent = "";
    approvedList.textContent = "";
    rejectedList.textContent = "";

    if (!snapshot.exists()) {

      pendingList.textContent = "No employee registrations found.";
      approvedList.textContent = "No approved employees.";
      rejectedList.textContent = "No rejected employees.";

      return;

    }

    let pendingCount = 0;
    let approvedCount = 0;
    let rejectedCount = 0;

    snapshot.forEach(child => {

      const uid = child.key;
      const employee = child.val();

      const status = employee.status || "pending";

      const card = document.createElement("div");
      card.className = "employee";

      const name = document.createElement("p");
      name.textContent = "Name: " + (employee.name || "Not available");

      const email = document.createElement("p");
      email.textContent = "Email: " + (employee.email || "Not available");

      const statusText = document.createElement("p");
      statusText.className = "status";
      statusText.textContent = "Status: " + status;

      const uidText = document.createElement("p");
      uidText.textContent = "UID: " + uid;

      card.append(name, email, statusText, uidText);

      if (status === "pending") {

        pendingCount++;

        const approveBtn = document.createElement("button");
        approveBtn.className = "approve";
        approveBtn.textContent = "Approve";

        approveBtn.onclick = () => approveEmployee(uid);

        const rejectBtn = document.createElement("button");
        rejectBtn.className = "reject";
        rejectBtn.textContent = "Reject";

        rejectBtn.onclick = () => rejectEmployee(uid);

        card.append(approveBtn, rejectBtn);

        pendingList.appendChild(card);

      } else if (status === "approved") {

        approvedCount++;
        approvedList.appendChild(card);

      } else if (status === "rejected") {

        rejectedCount++;
        rejectedList.appendChild(card);

      }

    });

    if (!pendingCount) {
      pendingList.textContent = "No pending employees.";
    }

    if (!approvedCount) {
      approvedList.textContent = "No approved employees.";
    }

    if (!rejectedCount) {
      rejectedList.textContent = "No rejected employees.";
    }

    showMessage("Employee list updated successfully.");

  } catch (error) {

    showMessage("Unable to load employees: " + error.message, true);

  } finally {

    loadingEmployees = false;

  }

}

// APPROVE EMPLOYEE

async function approveEmployee(uid) {

  if (!checkAdmin()) {
    showMessage("Admin authorization required.", true);
    return;
  }

  if (!confirm("Approve this employee?")) return;

  try {

    const updates = {};

    updates["employeeProfiles/" + uid + "/status"] = "approved";
    updates["authorizedEmployees/" + uid] = true;

    await db.ref().update(updates);

    showMessage("Employee approved successfully.");

    loadEmployees();

  } catch (error) {

    showMessage("Approval failed: " + error.message, true);

  }

}

// REJECT EMPLOYEE

async function rejectEmployee(uid) {

  if (!checkAdmin()) {
    showMessage("Admin authorization required.", true);
    return;
  }

  if (!confirm("Reject this employee?")) return;

  try {

    const updates = {};

    updates["employeeProfiles/" + uid + "/status"] = "rejected";
    updates["authorizedEmployees/" + uid] = null;

    await db.ref().update(updates);

    showMessage("Employee rejected successfully.");

    loadEmployees();

  } catch (error) {

    showMessage("Rejection failed: " + error.message, true);

  }

}

// REFRESH

document.getElementById("refreshBtn").onclick = () => {
  loadEmployees();
};

// LOGOUT

document.getElementById("logoutBtn").onclick = async () => {

  try {

    await auth.signOut();

    showMessage("Logged out successfully.");

  } catch (error) {

    showMessage(error.message, true);

  }

};

</script>

</body>
</html>
