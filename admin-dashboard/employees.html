
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiTrack GPS - Employees</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #1e293b;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    h1 { color: #172554; }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 2px 10px #00000010;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      padding: 12px 18px;
      margin-top: 10px;
      border: 0;
      border-radius: 7px;
      background: #1d4ed8;
      color: white;
      font-size: 15px;
    }
    .note { color: #64748b; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MultiTrack GPS</h1>
    <p>Employee Management</p>

    <div class="panel">
      <h2>Add Employee</h2>
      <input type="text" placeholder="Employee Full Name">
      <input type="email" placeholder="Employee Email">
      <button type="button">Add Employee</button>
      <p class="note">
        Employee registration and approval will be connected to Firebase.
      </p>
    </div>

    <div class="panel">
      <h2>Employee List</h2>
      <p class="note">No employee records loaded yet.</p>
    </div>
  </div>
</body>
</html>
