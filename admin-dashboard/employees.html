
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MultiTrack GPS - Employee Approval</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      padding: 20px;
      margin: 0;
    }
    .container { max-width: 650px; margin: auto; }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin: 16px 0;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }
    button {
      padding: 12px 18px;
      background: #1d4ed8;
      color: white;
      border: 0;
      border-radius: 7px;
      margin-top: 8px;
      cursor: pointer;
    }
    .danger { background: #64748b; }
    .hidden { display: none; }
    .employee {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      overflow-wrap: anywhere;
    }
    #message { margin-top: 12px; }
  </style>
</head>
<body>
<div class="container">
  <h1>MultiTrack GPS</h1>
  <p>Admin Employee Approval</p>

  <div class="panel" id="loginPanel">
    <h2>Admin Login</h2>
    <input id="email" type="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Admin Password">
    <button id="loginBtn">Login</button>
  </div>

  <div class="panel hidden" id="adminPanel">
    <h2>Authorize Employee</h2>
    <p>Enter the Firebase Authentication UID of an employee.</p>
    <input id="employeeUid" placeholder="Employee Firebase UID">
    <button id="approveBtn">Approve Employee</button>

    <h2>Authorized Employees</h2>
    <div id="employeeList">Loading...</div>
    <button class="danger" id="logoutBtn">Logout</button>
  </div>

  <p id="message"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
  // Replace these values with your Firebase Web App config.
  const firebaseConfig = {
    apiKey: "AIzaSyDQAe8VJIfwoxykr45mPoNXGFkMnG3Q8M0",
    authDomain: "multitrack-gps.firebaseapp.com",
    databaseURL: "https://multitrack-gps-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "multitrack-gps",
    storageBucket: "multitrack-gps.firebasestorage.app",
    messagingSenderId: "646292574395",
    appId: "1:646292574395:web:4d97b3aced2aad3fd1199e",
    measurementId: "G-FVWTQ5HRRG"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.database();

  const message = document.getElementById("message");
  const loginPanel = document.getElementById("loginPanel");
  const adminPanel = document.getElementById("adminPanel");

  function showMessage(text, error = false) {
    message.textContent = text;
    message.style.color = error ? "#dc2626" : "#15803d";
  }

  auth.onAuthStateChanged(user => {
  if (user && user.uid === "YOUR_ADMIN_UID") {
    loginPanel.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    loadEmployees();
  } else {
    adminPanel.classList.add("hidden");
    loginPanel.classList.remove("hidden");

    if (user) {
      auth.signOut();
      showMessage("Admin access only. Please login with Admin account.", true);
    }
  }
});

  document.getElementById("loginBtn").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await auth.signInWithEmailAndPassword(email, password);
      showMessage("Admin login successful.");
    } catch (error) {
      showMessage(error.message, true);
    }
  };

  document.getElementById("approveBtn").onclick = async () => {
    const uid = document.getElementById("employeeUid").value.trim();

    if (!uid) {
      showMessage("Enter an employee UID.", true);
      return;
    }

    try {
      await db.ref("authorizedEmployees/" + uid).set(true);
      document.getElementById("employeeUid").value = "";
      showMessage("Employee authorized successfully.");
      loadEmployees();
    } catch (error) {
      showMessage(error.message, true);
    }
  };

  function loadEmployees() {
    db.ref("authorizedEmployees").once("value")
      .then(snapshot => {
        const list = document.getElementById("employeeList");
        list.textContent = "";

        if (!snapshot.exists()) {
          list.textContent = "No authorized employees yet.";
          return;
        }

        snapshot.forEach(child => {
          const item = document.createElement("div");
          item.className = "employee";
          item.textContent = "UID: " + child.key + " — Authorized";
          list.appendChild(item);
        });
      })
      .catch(error => showMessage(error.message, true));
  }

  document.getElementById("logoutBtn").onclick = () => {
    auth.signOut();
  };
</script>
</body>
</html>
